name: Build Qt Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      
      - name: Install NDK 26.1.10909125
        run: |
          sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
      
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: true
      
      - name: Configure environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
      
      - name: Build APK with CMake
        run: |
          QT_CMAKE=$(find $QT_ROOT_DIR -name qt-cmake -type f | head -n1)
          $QT_CMAKE -G "Ninja" -B build -S . \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: build/android-build/*.apk
          if-no-files-found: error
